schema_version: 1

# Artifact files are never committed to this repository.  Public entries below
# were verified against immutable local receipts before being added.  Custom
# rank03 weights ship as a separate, hash-verified inference bundle. The
# locally converted GGUF may be supplied from an independently verified source.


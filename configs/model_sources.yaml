  anatomy:
    - xrv_chestxdet_pspnet
  medsam_refinement:
    - medsam_vit_base_weights
    - medsam_vit_base_config
    - medsam_vit_base_preprocessor
  historical_qwen_runtime:
    - qwen35_4b_q4_k_m_gguf

artifacts:

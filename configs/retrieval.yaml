schema_version: 1

engine:
  retrieval_version: tbx-retrieval-v1
  retrieval_mode: sparse
  candidate_limit: 40
  sparse_minimum_score: 0.0
  rrf_rank_constant: 60
  sparse_weight: 1.0
  dense_weight: 1.0
  fallback_to_sparse: true
  near_duplicate_threshold: 0.92
  near_duplicates_across_sources: false
  rerank_top_n: 20
  reranker_required: false
  require_verified_model_hashes: true

# Dense retrieval remains fail-closed until the deployment pins the exact local
# model artifact hash and builds a matching immutable vector generation. The
# adapter never downloads a model and `trust_remote_code` is never inferred.
dense:
  enabled: false
  adapter: bge_m3_local
  endpoint: null
  model_id: BAAI/bge-m3
  model_sha256: null
  revision: null
  dimensions: 1024
  normalized: true
  timeout_seconds: 15.0
  require_loopback: true
  query_prefix: ""
  document_prefix: ""
  model_path_env: RAG_EMBEDDING_MODEL_PATH
  cache_dir_env: RAG_EMBEDDING_CACHE_DIR
  device_env: RAG_EMBEDDING_DEVICE

# Qdrant local is the default single-node store: it has a maintained Python API,
# metadata filtering and a direct migration path to Qdrant server. sqlite-vec is
# retained as an exact small-corpus baseline. Only the offline index builder may
# write a generation; application workers open the promoted generation read-only.
vector_store:
  backend: qdrant_local
  qdrant_path: runtime://retrieval/qdrant_local
  sqlite_root: runtime://retrieval/sqlite_vec
  maximum_exact_candidates: 50000
  qdrant_base_url: null
  qdrant_collection: tbx-guidelines

# Reranking is a separate ablation and is not activated without a pinned model.
reranker:
  enabled: false
  adapter: http
  endpoint: http://127.0.0.1:7999/rerank
  model_id: BAAI/bge-reranker-v2-m3
  model_sha256: null
  timeout_seconds: 20.0
  require_loopback: true

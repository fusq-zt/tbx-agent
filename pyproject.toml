[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tbx-agent"
version = "0.1.0"
description = "Inference-only chest X-ray agent with grounded guideline retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "TBX-Agent contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.36,<2",
  "langgraph>=1.2.11,<2",
  "openai>=2.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.48,<2", "requests>=2.32,<3"]
ingestion = [
  "beautifulsoup4>=4.13,<5",
  "markdownify>=1.2,<2",
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
]
dicom = [
  # DICOM support is intentionally optional and limited to uncompressed,
  # single-frame monochrome CR/DX input. NumPy performs deterministic windowing.
  "numpy>=1.25,<3",
  "pydicom>=3.0,<4",
]
retrieval = [
  # Preferred single-node store. Tests inject embeddings and never fetch a model.
  "qdrant-client>=1.15,<2",
  # Imported lazily only when the explicitly configured offline BGE-M3 path is used.
  "FlagEmbedding>=1.3.5,<2",
  # Pre-1.0 native extension: pin the deployment-tested ABI exactly.
  "sqlite-vec==0.1.9",
]
anatomy = [
  # The adapter and public PSPNet artifact manifest are tested against this release.
  "torchxrayvision==1.5.2",
]
medsam = [
  # Isolated optional runtime for the fixed wanglab/medsam-vit-base HF port.
  # torch>=2.6 also avoids unsafe legacy torch.load versions for the verified .bin.
  "torch>=2.6,<3",
  "transformers==5.10.1",
]
qwen-build = [
  # Exact environment used for the pinned Qwen3.5-4B -> GGUF conversion.
  "gguf==0.19.0",
  "huggingface-hub==0.36.2",
  "numpy==1.26.4",
  "protobuf==4.25.9",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.11.0",
  "transformers==5.10.1",
]
vision = [
  # D-FINE imports its profiling helper from the package root even for
  # inference, so calflops is a runtime dependency rather than training-only.
  "calflops>=0.3,<1",
  "faster-coco-eval>=1.6.6,<2",
  "loguru>=0.7,<1",
  "numpy>=1.25,<3",
  "scipy>=1.11,<2",
  "tensorboard>=2.15,<3",
  "timm>=1.0.20,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  # calflops imports AutoTokenizer even for D-FINE vision-only inference.
  "transformers==5.10.1",
]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
tbx-agent-api = "tbx_agent.api.main:run"
tbx-agent-eval = "tbx_agent.evaluation.run:main"
tbx-agent-preflight = "tbx_agent.preflight:main"
tbx-agent-shenzhen-eval = "tbx_agent.evaluation.shenzhen:main"
tbx-agent-openai-compat = "tbx_agent.llm.openai_compat:main"
tbx-agent-models = "tbx_agent.artifacts.cli:main"
tbx-agent-qwen = "tbx_agent.llm.bootstrap_cli:main"
tbx-agent-medgemma = "tbx_agent.llm.medgemma_setup:main"
tbx-agent-system-bench = "tbx_agent.evaluation.system_bench_ci:main"
tbx-agent-software-conformance = "tbx_agent.evaluation.software_conformance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tbx_agent"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires optional HTTP/runtime dependencies",
  "real_rank03: loads frozen rank03 assets and is never run by default",
  "requires_model: requires an explicitly prepared local model and may be slow",
  "slow: long-running opt-in test excluded from the lightweight CI job",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

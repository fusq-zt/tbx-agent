name: tbx-agent

# No service is enabled implicitly. The only runnable profile is real rank03 plus
# an external pinned llama.cpp service; it requires the mounts/secret below:
#   docker compose --profile rank03 up --build

x-build-control: &build-control
  context: .
  args:
    TBX_BASE_IMAGE: ${TBX_BASE_IMAGE:-python:3.12-slim}
    TBX_INSTALL_EXTRAS: ${TBX_UI_INSTALL_EXTRAS:-ui,dicom}

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  # The real profile never downloads assets during image build. Run the host
  # bootstrap first, point TBX_MODEL_CACHE at its external output, and mount the
  # D-FINE checkout separately. The external service must be the pinned
  # OpenAI-compatible llama.cpp runtime expected by TBX-Agent, not an arbitrary
  # chat endpoint.
  api-rank03:
    <<: *runtime
    profiles: [rank03]
    build:
      context: .
      target: api
      args:
        TBX_BASE_IMAGE: ${TBX_CUDA_BASE_IMAGE:-python:3.12-slim}
        TBX_INSTALL_EXTRAS: ${TBX_REAL_INSTALL_EXTRAS:-ui,vision,anatomy,dicom}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TBX_AGENT_VISION_BACKEND: rank03
      TBX_AGENT_NARRATOR_BACKEND: llama_cpp
      TBX_AGENT_REQUIRE_REAL_INFERENCE: "true"
      TBX_AGENT_REQUIRE_LLM_INFERENCE: "true"
      TBX_AGENT_DEPLOYMENT_PROFILE: research
      TBX_ARTIFACT_ROOT: /models
      TBX_AGENT_CASE_ARTIFACT_ROOT: /data/cases
      TBX_AGENT_RANK03_RUNTIME_CONFIG: /run/tbx/rank03_runtime.json
      TBX_AGENT_DFINE_ROOT: /opt/dfine
      TBX_AGENT_CONTOUR_REFINEMENT_BACKEND: ${TBX_AGENT_CONTOUR_REFINEMENT_BACKEND:-none}
      TBX_AGENT_CONTOUR_REFINEMENT_DEVICE: ${TBX_AGENT_CONTOUR_REFINEMENT_DEVICE:-auto}
      # The API verifies the exact external llama.cpp executable and every file
      # in its bundle even though inference is reached through the TLS endpoint.
      # Mounting only the GGUF is insufficient for the fail-closed runtime
      # contract used by /readyz.
      TBX_AGENT_LLM_RUNTIME_CONFIG: /run/tbx/llm_runtime.generated.yaml
      LLAMA_CPP_BASE_URL: ${TBX_EXTERNAL_LLM_URL:?Set TBX_EXTERNAL_LLM_URL to the reviewed HTTPS llama.cpp endpoint}
      LLAMA_CPP_MODEL_ALIAS: ${LLAMA_CPP_MODEL_ALIAS:-tbx-medgemma-1.5-4b-it-q4-k-m}
      LLAMA_CPP_MODEL_PATH: ${TBX_LLM_MODEL_CONTAINER:-/models/llm/medgemma-1.5-4b-it-Q4_K_M.gguf}
      LLAMA_CPP_MODEL_SHA256: ${LLAMA_CPP_MODEL_SHA256:?Set the verified MedGemma GGUF SHA-256}
      LLAMA_CPP_SERVER_BUILD: ${LLAMA_CPP_SERVER_BUILD:-b10517}
      LLAMA_CPP_BINARY_PATH: /opt/llama/${TBX_LLAMA_SERVER_BINARY_NAME:?Set the registered llama-server filename}
      LLAMA_CPP_BUNDLE_MANIFEST_PATH: /run/tbx/llama-bundle-manifest.json
      LLAMA_CPP_API_KEY_FILE: /run/secrets/llama_cpp_api_key
      TBX_AGENT_LLAMA_CPP_ALLOW_REMOTE: "true"
    volumes:
      - type: volume
        source: tbx-agent-data
        target: /data
      - type: bind
        source: ${TBX_MODEL_CACHE:?Set TBX_MODEL_CACHE to the external registered artifact root}
        target: /models
        read_only: true
      - type: bind
        source: ${TBX_DFINE_ROOT:?Set TBX_DFINE_ROOT to the pinned D-FINE checkout}
        target: /opt/dfine
        read_only: true
      - type: bind
        source: ${TBX_RANK03_RUNTIME_CONFIG_HOST:?Set the generated rank03 runtime contract path}
        target: /run/tbx/rank03_runtime.json
        read_only: true
      - type: bind
        source: ${TBX_LLM_RUNTIME_CONFIG_HOST:?Set the generated llama.cpp runtime contract path}
        target: /run/tbx/llm_runtime.generated.yaml
        read_only: true
      - type: bind
        source: ${TBX_LLAMA_BUNDLE_DIR:?Set the registered llama.cpp bundle directory}
        target: /opt/llama
        read_only: true
      - type: bind
        source: ${TBX_LLAMA_BUNDLE_MANIFEST_HOST:?Set the generated llama.cpp bundle manifest path}
        target: /run/tbx/llama-bundle-manifest.json
        read_only: true
      - type: bind
        source: ${LLAMA_CPP_API_KEY_FILE_HOST:?Set the protected llama.cpp API key file path}
        target: /run/secrets/llama_cpp_api_key
        read_only: true
    ports:
      - "127.0.0.1:${TBX_API_PORT:-8000}:8000"
    # Uncomment only after selecting a tested CUDA base image/runtime.
    # gpus: all

  ui-rank03:
    profiles: [rank03]
    build:
      <<: *build-control
      target: ui
    environment:
      TBX_AGENT_API_URL: http://api-rank03:8000
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    depends_on:
      api-rank03:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TBX_UI_PORT:-8501}:8501"

volumes:
  tbx-agent-data:
